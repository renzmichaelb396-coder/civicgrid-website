<svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gold gradient for center node -->
    <radialGradient id="goldGrad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#E0C068"/>
      <stop offset="100%" stop-color="#B8943E"/>
    </radialGradient>
    <!-- Dark node gradient -->
    <radialGradient id="darkNode" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#4A5568"/>
      <stop offset="100%" stop-color="#1A202C"/>
    </radialGradient>
    <!-- White node gradient -->
    <radialGradient id="whiteNode" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E0"/>
    </radialGradient>
  </defs>

  <!-- Back face lines (depth) -->
  <line x1="55" y1="45" x2="145" y2="45" stroke="white" stroke-width="2" opacity="0.3"/>
  <line x1="55" y1="45" x2="55" y2="135" stroke="white" stroke-width="2" opacity="0.3"/>
  <line x1="145" y1="45" x2="145" y2="135" stroke="white" stroke-width="2" opacity="0.3"/>
  <line x1="55" y1="135" x2="145" y2="135" stroke="white" stroke-width="2" opacity="0.3"/>

  <!-- Outer grid lines - horizontal -->
  <line x1="30" y1="30" x2="170" y2="30" stroke="white" stroke-width="2.5" opacity="0.5"/>
  <line x1="30" y1="100" x2="170" y2="100" stroke="white" stroke-width="2.5" opacity="0.5"/>
  <line x1="30" y1="170" x2="170" y2="170" stroke="white" stroke-width="2.5" opacity="0.5"/>

  <!-- Outer grid lines - vertical -->
  <line x1="30" y1="30" x2="30" y2="170" stroke="white" stroke-width="2.5" opacity="0.5"/>
  <line x1="100" y1="30" x2="100" y2="170" stroke="white" stroke-width="2.5" opacity="0.5"/>
  <line x1="170" y1="30" x2="170" y2="170" stroke="white" stroke-width="2.5" opacity="0.5"/>

  <!-- Diagonal lines to center -->
  <line x1="30" y1="30" x2="100" y2="100" stroke="white" stroke-width="1.5" opacity="0.35"/>
  <line x1="170" y1="30" x2="100" y2="100" stroke="white" stroke-width="1.5" opacity="0.35"/>
  <line x1="30" y1="170" x2="100" y2="100" stroke="white" stroke-width="1.5" opacity="0.35"/>
  <line x1="170" y1="170" x2="100" y2="100" stroke="white" stroke-width="1.5" opacity="0.35"/>

  <!-- Cross diagonals -->
  <line x1="30" y1="30" x2="170" y2="170" stroke="white" stroke-width="1.2" opacity="0.25"/>
  <line x1="170" y1="30" x2="30" y2="170" stroke="white" stroke-width="1.2" opacity="0.25"/>

  <!-- Depth connector lines (3D effect) -->
  <line x1="30" y1="30" x2="55" y2="45" stroke="white" stroke-width="1.5" opacity="0.25"/>
  <line x1="170" y1="30" x2="145" y2="45" stroke="white" stroke-width="1.5" opacity="0.25"/>
  <line x1="30" y1="170" x2="55" y2="135" stroke="white" stroke-width="1.5" opacity="0.25"/>
  <line x1="170" y1="170" x2="145" y2="135" stroke="white" stroke-width="1.5" opacity="0.25"/>
  <line x1="100" y1="30" x2="100" y2="45" stroke="white" stroke-width="1.2" opacity="0.2"/>
  <line x1="30" y1="100" x2="55" y2="90" stroke="white" stroke-width="1.2" opacity="0.2"/>
  <line x1="170" y1="100" x2="145" y2="90" stroke="white" stroke-width="1.2" opacity="0.2"/>
  <line x1="100" y1="170" x2="100" y2="135" stroke="white" stroke-width="1.2" opacity="0.2"/>

  <!-- Back face corner nodes (smaller, more transparent for depth) -->
  <circle cx="55" cy="45" r="6" fill="url(#whiteNode)" opacity="0.4"/>
  <circle cx="145" cy="45" r="6" fill="url(#whiteNode)" opacity="0.4"/>
  <circle cx="55" cy="135" r="6" fill="url(#whiteNode)" opacity="0.4"/>
  <circle cx="145" cy="135" r="6" fill="url(#whiteNode)" opacity="0.4"/>

  <!-- Front face corner nodes -->
  <circle cx="30" cy="30" r="11" fill="url(#whiteNode)"/>
  <circle cx="170" cy="30" r="11" fill="url(#whiteNode)"/>
  <circle cx="30" cy="170" r="11" fill="url(#whiteNode)"/>
  <circle cx="170" cy="170" r="11" fill="url(#whiteNode)"/>

  <!-- Mid-edge nodes -->
  <circle cx="100" cy="30" r="9" fill="url(#whiteNode)"/>
  <circle cx="100" cy="170" r="9" fill="url(#whiteNode)"/>
  <circle cx="30" cy="100" r="9" fill="url(#whiteNode)"/>
  <circle cx="170" cy="100" r="9" fill="url(#whiteNode)"/>

  <!-- Center gold node -->
  <circle cx="100" cy="100" r="15" fill="url(#goldGrad)"/>
  <circle cx="100" cy="100" r="15" fill="none" stroke="#C9A84C" stroke-width="1" opacity="0.5"/>
</svg>